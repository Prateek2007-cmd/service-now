# Machine Learning Pipeline Configuration for HERE Support Platform

dataset:
  sample_path: "ml/data/sample/student_support_dataset.csv"
  test_size: 0.20
  random_state: 42

features:
  max_features: 1500
  ngram_range: [1, 2]
  sublinear_tf: true
  min_df: 1

models:
  intent:
    model_type: "logistic_regression"
    c_param: 2.0
    max_iter: 1000
    output_dir: "ml/models/intent_model"
  urgency:
    model_type: "logistic_regression"
    c_param: 1.5
    max_iter: 1000
    output_dir: "ml/models/urgency_model"
